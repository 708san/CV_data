[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-data-lesson"
version = "0.1.0a4"
description = "高校生が身近な課題に画像AIを活用するための教材ライブラリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{name = "CV Data project contributors"}]
keywords = ["education", "computer-vision", "dataset", "colab", "japanese"]
dependencies = [
    "numpy>=1.23,<3",
    "Pillow>=9,<14",
    "pandas>=1.5,<4",
    "matplotlib>=3.6,<4",
    "japanize-matplotlib>=1.1.3,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Japanese",
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pandas>=1.5,<4", "Pillow>=9,<14"]
dataframe = ["pandas>=1.5,<4"]
display = ["numpy>=1.23,<3", "Pillow>=9,<14", "pandas>=1.5,<4", "matplotlib>=3.6,<4", "japanize-matplotlib>=1.1.3,<2"]
torch = ["numpy>=1.23,<3", "Pillow>=9,<14", "torch>=2.6,<3", "torchvision>=0.21,<1"]
ocr = [
    "paddleocr==3.1.0",
    "paddlex[ocr]>=3.1.0,<3.2.0",
    "langchain>=0.2,<1",
    "requests>=2.32.2,<2.33",
    "huggingface_hub>=0.23,<3",
    "Pillow>=9,<14",
]
vision = ["numpy>=1.23,<3", "Pillow>=9,<14", "transformers>=4.41,<6", "huggingface_hub>=0.23,<3"]
diffusion = [
    "Pillow>=9,<14",
    "diffusers[torch]>=0.30,<1",
    "transformers>=4.41,<6",
    "huggingface_hub>=0.23,<3",
    "peft>=0.21.2,<1",
]

[project.urls]
Repository = "https://github.com/708san/CV_data"
Documentation = "https://github.com/708san/CV_data/blob/main/docs/student-guide.md"
Issues = "https://github.com/708san/CV_data/issues"
Changelog = "https://github.com/708san/CV_data/releases"
Artifacts = "https://github.com/708san/CV_data_artifacts"

[tool.setuptools.packages.find]
where = ["src"]
