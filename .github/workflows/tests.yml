name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install '.[test]'
      - name: Offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check binaries and import installed wheel
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          forbidden = {
              ".png", ".jpg", ".jpeg", ".webp", ".bmp", ".tif", ".tiff",
              ".safetensors", ".ckpt", ".pt", ".pth", ".onnx", ".tflite",
          }
          distributions = sorted(Path("dist").iterdir())
          if len(distributions) != 2:
              raise SystemExit(f"Expected wheel and sdist, found {[p.name for p in distributions]}")
          wheel = next((p for p in distributions if p.suffix == ".whl"), None)
          sdist = next((p for p in distributions if p.name.endswith(".tar.gz")), None)
          if wheel is None or sdist is None:
              raise SystemExit("Both wheel and .tar.gz source distribution are required")
          members = []
          with zipfile.ZipFile(wheel) as package:
              members.extend(package.namelist())
          with tarfile.open(sdist, "r:gz") as package:
              members.extend(item.name for item in package.getmembers() if item.isfile())
          blocked = [name for name in members if Path(name).suffix.lower() in forbidden]
          if blocked:
              raise SystemExit(f"Image/model binaries found in package: {blocked[:20]}")
          PY
          python -m pip install --no-deps --target /tmp/cv-data-lesson-wheel dist/*.whl
          cd /tmp
          PYTHONPATH=/tmp/cv-data-lesson-wheel python - <<'PY'
          import cvlesson
          from cvlesson import datasets
          available = datasets.list_available()
          assert available, "the installed wheel returned an empty catalog"
          print(f"Installed wheel import OK: {cvlesson.__file__}; {len(available)} datasets listed.")
          PY
