name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install '.[test]'
      - name: Offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  display-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install base and test dependencies
        run: python -m pip install '.[test]'
      - name: Offline tests with standard installation dependencies
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  optional-dependency-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve OCR, vision, and diffusion extras together without installing them
        run: python -m pip install --dry-run --ignore-installed '.[ocr,vision,diffusion]'
  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install build twine
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate PyPI package metadata
        run: python -m twine check dist/*
      - name: Check archives contain no dataset or model binaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          forbidden = {
              ".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp", ".tif", ".tiff",
              ".safetensors", ".ckpt", ".pt", ".pth", ".onnx", ".npy", ".npz",
              ".zip", ".tar", ".gz",
          }
          archives = sorted(Path("dist").iterdir())
          assert len(archives) == 2, archives
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as package:
                      members = [(item.filename, item.file_size) for item in package.infolist() if not item.is_dir()]
              else:
                  with tarfile.open(archive, "r:gz") as package:
                      members = [(item.name, item.size) for item in package.getmembers() if item.isfile()]
              assert members, archive
              for name, size in members:
                  path = Path(name)
                  assert path.suffix.lower() not in forbidden, f"{archive}: forbidden file {name}"
                  assert not {"CV_sample_data", "CV_data_artifacts", "artifacts"} & set(path.parts), name
                  assert size < 50_000_000, f"{archive}: unexpectedly large member {name} ({size} bytes)"
          PY
      - name: Install wheel into a clean virtual environment
        run: |
          python -m venv /tmp/cvlesson-package-smoke
          /tmp/cvlesson-package-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/cvlesson-package-smoke/bin/python -c "import cvlesson; from cvlesson import datasets; print(datasets.list_available(audience='student')[:1])"
