name: Fixed Release manual audit
on:
  workflow_dispatch:
    inputs:
      dataset_id:
        description: '検査する公開済み固定Release'
        type: choice
        required: true
        default: festival_icons
        options:
          - festival_icons
          - tomato_leaves
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -e . Pillow
      - name: Download fixed Release and inspect all images
        run: python -m cvlesson.audit "${{ inputs.dataset_id }}" --check-images --report audit-results/report.json
      - name: Store metadata-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ inputs.dataset_id }}
          path: audit-results/report.json
          if-no-files-found: warn
