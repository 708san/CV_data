name: Publish package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match expected {expected!r}")
          print(f"Release tag matches package version: {actual}")
          PY
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Reject dataset and model binaries in distributions
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          forbidden = {
              ".jpg", ".jpeg", ".png", ".webp", ".gif", ".bmp", ".tif", ".tiff",
              ".safetensors", ".ckpt", ".pt", ".pth", ".onnx", ".npy", ".npz",
              ".zip", ".tar", ".gz",
          }
          archives = sorted(Path("dist").iterdir())
          if len(archives) != 2:
              raise SystemExit(f"Expected wheel and sdist, got: {[p.name for p in archives]}")
          members = []
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as package:
                      members.extend((archive.name, item.filename, item.file_size) for item in package.infolist() if not item.is_dir())
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive, "r:gz") as package:
                      members.extend((archive.name, item.name, item.size) for item in package.getmembers() if item.isfile())
              else:
                  raise SystemExit(f"Unexpected distribution file: {archive.name}")
          for archive, name, size in members:
              path = Path(name)
              if path.suffix.lower() in forbidden:
                  raise SystemExit(f"Forbidden dataset/model file in {archive}: {name}")
              if {"CV_sample_data", "CV_data_artifacts", "artifacts"} & set(path.parts):
                  raise SystemExit(f"Forbidden artifact directory in {archive}: {name}")
              if size >= 50_000_000:
                  raise SystemExit(f"Unexpectedly large package member in {archive}: {name} ({size} bytes)")
          print(f"Validated {len(archives)} distributions and {len(members)} members.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish validated distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cv-data-lesson/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
